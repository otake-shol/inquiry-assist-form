# 日本語の文言を含むため、UTF-8 で読まれる YAML にしている（.properties は ISO-8859-1 として読まれ文字化けした）
spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

inquiry:
  # スキルごとの実装（mock | ollama）。設定を書かなければすべてモックで、外部のAIには接続しない。
  # 手元のモデルで動かす設定はプロファイル local-ai（application-local-ai.yaml）。
  # 本番（プロファイル production）では、1つでもモックがあれば起動を止める
  skills:
    reception: { provider: mock }
    interviewer: { provider: mock }
    restater: { provider: mock }
    investigator: { provider: mock }
    explainer: { provider: mock }
  knowledge:
    provider: mock
  ollama:
    base-url: http://localhost:11434
    keep-alive: 30m
  mock:
    # モックの [遅延] タグで進捗の各段階が待つ時間
    slow-step-delay: 2s
  # 名前を持つ言語。先頭が既定の言語。API は、リクエストごとの見る人の言語の名前を返す。その言語の名前がない項目は、既定の言語の名前で返す
  languages: [ja, en]
  # 種類と緊急度の名前。種類は聞く順
  types:
    - id: HOW_TO
      label: { ja: 使い方を知りたい, en: How to use something }
      hint: { ja: 操作の手順, en: Steps for an operation }
    - id: HOW_IT_WORKS
      label: { ja: 仕組みを知りたい, en: How something works }
      hint: { ja: 動きや決まりの理由, en: Why it behaves the way it does }
    - id: LOOKS_WRONG
      label: { ja: おかしいかもしれない, en: Something looks wrong }
      hint: { ja: 思った動きと違う, en: It does not behave as expected }
    - id: DO_FOR_ME
      label: { ja: やってほしい, en: Do something for me }
      hint: { ja: データの修正や設定の変更, en: Fix data or change a setting }
    - id: CHANGE_REQUEST
      label: { ja: 変えてほしい, en: Change something }
      hint: { ja: 機能の追加や改善, en: Add or improve a feature }
  urgencies:
    - id: NORMAL
      label: { ja: 通常, en: Normal }
    - id: HURRY
      label: { ja: 急ぎ, en: Urgent }
    - id: BLOCKED
      label: { ja: 業務が止まっている, en: Work is blocked }
  # システムと、その機能の一覧。functions を省いたシステムは、機能を聞かない。
  # slack-webhook-url は Webhook の URL を含む秘密情報のため、ここには書かず、環境変数
  # （例: INQUIRY_SYSTEMS_0_SLACK_WEBHOOK_URL）などで与える。
  # 既定は、骨組みであることが分かる仮の名前。実際の一覧は、環境ごとの設定で差し替える
  systems:
    - id: system-a
      label: { ja: システムA, en: System A }
      functions:
        - id: a-1
          label: { ja: 機能A-1, en: Function A-1 }
        - id: a-2
          label: { ja: 機能A-2, en: Function A-2 }
    - id: system-b
      label: { ja: システムB, en: System B }
      functions:
        - id: b-1
          label: { ja: 機能B-1, en: Function B-1 }
    - id: system-c
      label: { ja: システムC, en: System C }
  # マスの設定。置き場所ごとの詳しい質問。system / function / type は、省くと「すべて」。
  # 当てはまる設定のうち、指定した項目が最も多いものを1つ使う（同数なら、書かれた順で先のもの）。
  # 質問は3問まで。当てはまる設定に質問がなければ、聞き手のスキルが質問を作る
  cells:
    - system: system-a
      type: LOOKS_WRONG
      questions:
        - id: since
          text: { ja: いつから起きていますか, en: "Since when has this been happening?" }
          options:
            - { id: today, label: { ja: 今日から, en: Since today } }
            - { id: this-week, label: { ja: 今週から, en: Since this week } }
            - { id: earlier, label: { ja: もっと前から, en: Earlier } }
  # Slack の既定の投稿先は INQUIRY_SLACK_DEFAULT_WEBHOOK_URL で、リンクの基点は INQUIRY_PUBLIC_BASE_URL で与える
  # 担当者に送った後に画面が見せる案内文。連絡方法が決まったら差し替える
  filed-guidance:
    ja: 担当者が内容を確認し、このページに返信します。返信が届くと「送った問い合わせ」に印がつきます。
    en: "The support team will review this and reply on this page. When a reply arrives, a mark appears in “My inquiries”."
  # 時間で動く決まり。結果を本人が確かめている件に返事がないとき、知らせてから回答済みで終える（営業日は月曜から金曜。祝日は扱わない）
  rules:
    zone: Asia/Tokyo
    no-reply:
      remind-after-business-days: 5
      close-after-business-days: 5
    sweep-enabled: true
    sweep-interval: 15m
    # 本人が待つ調査を、担当者に引き継ぐまでの時間。超えたら担当者に渡し、調査は裏で続ける
    answer-timeout: 60s
  # スキルの実行記録（trace）を画面に見せるか。本番では false にする（内部の言葉とモデルの名前を本人に見せないため）
  trace:
    enabled: true
  # 認証を加えるまでの、利用者と担当者の表示名（inquiry.dev.user-name / inquiry.dev.operator-name で変える。
  # 既定は「開発用ユーザー」と「担当者（開発用）」）
