# 日本語の文言を含むため、UTF-8 で読まれる YAML にしている（.properties は ISO-8859-1 として読まれ文字化けした）
spring:
  application:
    name: backend
  profiles:
    # 既定はモック。本番は production + bedrock を明示する（production と mock の併用は起動時に拒否）
    default: mock
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

inquiry:
  mock:
    # モックの [遅延] タグで進捗の各段階が待つ時間
    slow-step-delay: 2s
  # 対象システムの一覧。slack-webhook-url は Webhook の URL を含む秘密情報のため、
  # ここには書かず、環境変数（例: INQUIRY_SYSTEMS_0_SLACK_WEBHOOK_URL）などで与える
  systems:
    - id: job-admin
      label: 求人管理画面
    - id: applicant-list
      label: 応募者向けの一覧
    - id: billing
      label: 請求管理
  # Slack の既定の投稿先は INQUIRY_SLACK_DEFAULT_WEBHOOK_URL で、リンクの基点は INQUIRY_PUBLIC_BASE_URL で与える
  # 障害の案内文。案内先が決まったら差し替える
  incident-guidance: 障害の連絡は専用の経路へお願いします（案内先は未設定）
  # 担当者に送った後に画面が見せる案内文。連絡方法が決まったら差し替える
  filed-guidance: 担当者が内容を確認して連絡します。（連絡方法は未設定）
