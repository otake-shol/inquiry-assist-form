spring.application.name=backend
# 既定はモック。本番は production + bedrock を明示する（production と mock の併用は起動時に拒否）
spring.profiles.default=mock
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# モックの [遅延] タグで進捗の各段階が待つ時間
inquiry.mock.slow-step-delay=2s
# 障害の案内文。案内先が決まったら差し替える
inquiry.incident-guidance=障害の連絡は専用の経路へお願いします（案内先は未設定）
