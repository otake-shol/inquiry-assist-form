# テスト用の設定。本体の application.yaml に重ねて読まれる（一覧は丸ごと置き換わる）。
# 本体の既定は仮の名前（システムA など）だが、テストでは業務らしい名前の一覧を使う。
# 文章に含まれる名前から置き場所を置く動きを、意味のある名前で確かめるため。
inquiry:
  # 時間で動く決まりは、定期的には回さない。テストは run(now) を直接呼ぶ
  rules:
    sweep-enabled: false
  # 仕様の持ち主（相談先）。全体、システム、マスの3段を確かめる。
  # 求人管理画面の「求人の掲載」×「使い方を知りたい」はマスの設定、求人管理画面のそのほかはシステムの設定、それ以外は全体
  consultants: [全体の仕様の持ち主]
  systems:
    - id: job-admin
      label: { ja: 求人管理画面, en: Job admin }
      consultants: [求人の仕様の持ち主]
      functions:
        - id: posting
          label: { ja: 求人の掲載, en: Posting }
        - id: applicants
          label: { ja: 応募者の一覧, en: Applicants }
    - id: billing
      label: { ja: 請求管理, en: Billing }
      functions:
        - id: invoice
          label: { ja: 請求書, en: Invoices }
    - id: reports
      label: { ja: レポート, en: Reports }
  cells:
    - system: job-admin
      function: posting
      type: HOW_TO
      consultants: [掲載の仕様の持ち主, 掲載の副担当]
    - system: job-admin
      type: LOOKS_WRONG
      questions:
        - id: since
          text: { ja: いつから起きていますか, en: "Since when has this been happening?" }
          options:
            - { id: today, label: { ja: 今日から, en: Since today } }
            - { id: this-week, label: { ja: 今週から, en: Since this week } }
            - { id: earlier, label: { ja: もっと前から, en: Earlier } }
    - system: billing
      function: invoice
      type: DO_FOR_ME
      questions:
        - id: partner
          text: { ja: 対象の取引先はどこですか, en: "Which business partner is it for?" }
    # 答えの読み取りの確認用。2問あり、選択肢の名前が文章に含まれていれば読み取られる
    - system: job-admin
      function: applicants
      type: CHANGE_REQUEST
      questions:
        - id: scope
          text: { ja: どのくらいの範囲ですか, en: "How wide is the scope?" }
          options:
            - { id: once, label: { ja: 今回だけ, en: Only this time } }
            - { id: always, label: { ja: 常に, en: Always } }
        - id: effect
          text: { ja: 何に困っていますか, en: "What is the trouble?" }
          options:
            - { id: slow, label: { ja: 遅い, en: Slow } }
            - { id: wrong, label: { ja: 間違える, en: Wrong } }
