# ローカル開発用の PostgreSQL。bootRun 時に spring-boot-docker-compose が自動で起動・接続する。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inquiry_assist
      POSTGRES_USER: inquiry
      POSTGRES_PASSWORD: inquiry
    ports:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
